[project]
name = "fabrica-agentica"
version = "0.1.0"
description = "Fábrica de software agêntica: do pedido à issue especificada, com LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eduardo Ribeiro" }]
keywords = ["langgraph", "langchain", "agentes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-core>=0.3",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = [
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
fabrica = "fabrica.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fabrica = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A raiz precisa estar no path: o script ``pytest`` do CI não inclui o diretório atual.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
