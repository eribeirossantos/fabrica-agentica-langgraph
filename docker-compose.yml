services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      FABRICA_OFFLINE: "1"
      FABRICA_EMBEDDINGS: fake
      FABRICA_KNOWLEDGE_DIR: /app/knowledge
      FABRICA_DATABASE_URL: postgresql+psycopg://fabrica:fabrica@postgres:5432/fabrica
      FABRICA_CHECKPOINTER: postgres
      FABRICA_CHECKPOINTER_URL: postgresql://fabrica:fabrica@postgres:5432/fabrica
      FABRICA_REDIS_URL: redis://redis:6379/0
      FABRICA_VECTOR_STORE: pgvector
      FABRICA_LOG_FORMAT: json
      FABRICA_STARTUP_RETRIES: "15"
      FABRICA_STARTUP_DELAY: "2"
      OTEL_TRACES_EXPORTER: console
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fabrica
      POSTGRES_PASSWORD: fabrica
      POSTGRES_DB: fabrica
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrica -d fabrica"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector:0.109.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
